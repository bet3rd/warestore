[project]
name = "steam-cache-login-tool"
dynamic = ["version"]
description = "Steam cache login and account management tool"
requires-python = ">=3.12"
dependencies = [
    "chardet>=5.0",
    "cryptography>=42.0",
    "pillow>=9.0",
    "psutil>=5.9",
    "pyjwt>=2.8",
    "pyqt5>=5.15,<6",
    "pywin32>=305",
    "requests>=2.28,<3",
    "steam[client]>=1.4.4",
    "vdf>=3.4",
]

[project.scripts]
warestore = "warestore.presentation.account_manager.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warestore"]

[tool.hatch.version]
path = "src/warestore/__init__.py"

[tool.uv]
package = true
required-environments = ["sys_platform == 'win32'"]

[dependency-groups]
dev = ["pyinstaller", "pytest>=8.0", "python-semantic-release>=9.21,<11"]

[tool.semantic_release]
version_variables = ["src/warestore/__init__.py:__version__"]
commit_parser = "conventional"
tag_format = "v{version}"
upload_to_vcs_release = true
allow_zero_version = false
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release."

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.kway]
match = "kway"
prerelease = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
